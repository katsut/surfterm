[package]
name = "surfterm"
version = "0.1.0"
edition = "2021"
description = "AI-aware terminal emulator for managing multiple coding sessions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/katsut/surfterm"

[dependencies]
# PTY & VT emulation
portable-pty = "0.8"
alacritty_terminal = "0.25"

# Rendering
wgpu = "28"
glyphon = "0.10"
winit = "0.30"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Pattern matching
regex = "1"

# File watching
notify = "8"

# Syntax highlighting
syntect = "5"

# Diff
similar = "2"

# Hashing (auto accent color)
seahash = "4"

# Unique IDs
uuid = { version = "1", features = ["v4"] }

# Menu bar
muda = "0.15"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "stream_splitter"
harness = false

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
strip = true
