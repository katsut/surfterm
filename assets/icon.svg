<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <!-- Electric wave gradient (blue → teal → green) -->
    <linearGradient id="ewave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="40%" stop-color="#74c7ec"/>
      <stop offset="70%" stop-color="#94e2d5"/>
      <stop offset="100%" stop-color="#a6e3a1"/>
    </linearGradient>
    <!-- Glow for the wave -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Stronger glow for prompt -->
    <filter id="promptGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Electric particle trails (dots riding along the wave path) -->
  <g opacity="0.5">
    <circle cx="180" cy="588" r="4" fill="#89b4fa"/>
    <circle cx="260" cy="540" r="3" fill="#89b4fa"/>
    <circle cx="350" cy="580" r="5" fill="#74c7ec"/>
    <circle cx="520" cy="490" r="3" fill="#74c7ec"/>
    <circle cx="620" cy="520" r="4" fill="#94e2d5"/>
    <circle cx="750" cy="470" r="3" fill="#94e2d5"/>
    <circle cx="840" cy="500" r="5" fill="#a6e3a1"/>
    <circle cx="900" cy="480" r="3" fill="#a6e3a1"/>
  </g>

  <!-- Main electric wave — smooth sine-like curve -->
  <path d="M 80 600
           C 180 480, 280 640, 400 540
           S 560 420, 680 500
           S 840 400, 960 460"
        fill="none" stroke="url(#ewave)" stroke-width="40" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Thinner echo wave above -->
  <path d="M 80 580
           C 180 470, 280 620, 400 520
           S 560 400, 680 480
           S 840 380, 960 440"
        fill="none" stroke="url(#ewave)" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

  <!-- Thinner echo wave below -->
  <path d="M 80 630
           C 180 510, 280 670, 400 570
           S 560 450, 680 530
           S 840 430, 960 490"
        fill="none" stroke="url(#ewave)" stroke-width="6" stroke-linecap="round" opacity="0.25"/>

  <!-- Terminal prompt "❯_" riding ON the wave (positioned at the wave's crest) -->
  <g filter="url(#promptGlow)">
    <!-- Prompt chevron -->
    <text x="340" y="470" font-family="Menlo, Monaco, 'Courier New', monospace" font-size="200" font-weight="bold" fill="#a6e3a1">❯</text>
    <!-- Blinking cursor -->
    <rect x="540" y="330" width="24" height="150" rx="6" fill="#f5c2e7"/>
  </g>

  <!-- Subtle scan lines (CRT / digital feel) -->
  <g stroke="#45475a" stroke-width="1" opacity="0.15">
    <line x1="100" y1="200" x2="924" y2="200"/>
    <line x1="100" y1="350" x2="924" y2="350"/>
    <line x1="100" y1="700" x2="924" y2="700"/>
    <line x1="100" y1="850" x2="924" y2="850"/>
  </g>
</svg>
