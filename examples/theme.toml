# Surfterm Theme Configuration
#
# This file shows all available theme colors with their default values
# (Catppuccin Mocha). Copy this file to one of:
#
#   ~/.config/surfterm/theme.toml       (global theme)
#   <project>/.surfterm/theme.toml      (per-directory override)
#
# All fields are optional. Unspecified fields use the built-in defaults.
# Colors are specified as hex strings in "#RRGGBB" format.

# Base colors
[colors]
background = "#1e1e2e"     # Main background
foreground = "#cdd6f4"     # Default text color
cursor     = "#f5e0dc"     # Cursor color
accent     = "#f38ba8"     # Accent color for highlights

# Sidebar (session list panel on the right)
[colors.sidebar]
background  = "#181825"    # Sidebar background
foreground  = "#cdd6f4"    # Session name text
separator   = "#585b70"    # Separator line color
new_session = "#a6e3a1"    # "+ New Session" button text
active_bg   = "#45475a"    # Background for the active session row
selected_bg = "#585b70"    # Background for the keyboard-selected row

# Card title bars (stacked session cards in main area)
[colors.card]
border       = "#313244"   # Border/separator characters
title        = "#cdd6f4"   # Background card title text
active_title = "#89b4fa"   # Active (foreground) card title text

# State indicator dots
[colors.state]
idle    = "#6c7086"        # Idle state (gray)
running = "#f9e2af"        # Running state (yellow)
waiting = "#a6e3a1"        # Waiting for input (green)
error   = "#f38ba8"        # Error state (red)
